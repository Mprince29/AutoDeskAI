version: "3.8"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.12
    container_name: autodeskai-backend
    image: autodeskai-backend:latest
    ports:
      - "8000:8000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - COMPANY_DOMAIN=${COMPANY_DOMAIN:-}
      - TRUSTED_EMAIL_DOMAINS=${TRUSTED_EMAIL_DOMAINS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-common}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-http://localhost:8000/api/auth/microsoft/callback}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_DRAFTER_MODEL=${LLM_DRAFTER_MODEL:-gemini/gemini-2.5-flash}
      - LLM_EXTRACTOR_MODEL=${LLM_EXTRACTOR_MODEL:-gemini/gemini-2.5-flash}
      - LLM_CLASSIFIER_MODEL=${LLM_CLASSIFIER_MODEL:-gemini/gemini-2.5-flash}
      - LLM_VALIDATOR_MODEL=${LLM_VALIDATOR_MODEL:-groq/llama-3.3-70b-versatile}
      - LLM_ROUTER_MODEL=${LLM_ROUTER_MODEL:-gemini/gemini-2.5-flash}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - ATLASSIAN_CLIENT_ID=${ATLASSIAN_CLIENT_ID}
      - ATLASSIAN_CLIENT_SECRET=${ATLASSIAN_CLIENT_SECRET}
      - NOTION_CLIENT_ID=${NOTION_CLIENT_ID}
      - NOTION_CLIENT_SECRET=${NOTION_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - CAL_CLIENT_ID=${CAL_CLIENT_ID}
      - CAL_CLIENT_SECRET=${CAL_CLIENT_SECRET}
      - CAL_USERNAME=${CAL_USERNAME:-master-prince-kyhqsm}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - TRELLO_API_KEY=${TRELLO_API_KEY:-}
      - TRELLO_TOKEN=${TRELLO_TOKEN:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_SERVER_URL=${JIRA_SERVER_URL:-}
      - JIRA_USER_EMAIL=${JIRA_USER_EMAIL:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - SERPAPI_KEY=${SERPAPI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - PDL_API_KEY=${PDL_API_KEY:-}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ESCALATION_NOTIFY_EMAIL=${ESCALATION_NOTIFY_EMAIL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - MAIL_DAY_CAP=${MAIL_DAY_CAP:-500}
      - MAIL_MIN_CAP=${MAIL_MIN_CAP:-40}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - AGENT_SECURITY_SECRET=${AGENT_SECURITY_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CHROMADB_PATH=./chroma_db
      - ENABLE_AGENT_SDK=${ENABLE_AGENT_SDK:-true}

    volumes:
      - backend_logs:/app/logs
      - backend_chroma:/app/chroma_db
      - backend_uploads:/app/uploads

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: autodeskai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: autodeskai-frontend
    image: autodeskai-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - NEXT_PUBLIC_PICOVOICE_KEY=${NEXT_PUBLIC_PICOVOICE_KEY:-}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: autodeskai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_logs:
    driver: local
  backend_chroma:
    driver: local
  backend_uploads:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  default:
    name: autodeskai-network
    driver: bridge
